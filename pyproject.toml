[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rnel"
version = "0.3.0"
description = "A toolkit for neutrosophic evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Maikel Yelandi Leyva-Vázquez"}, {name = "Florentin Smarandache"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["neutrosophic logic", "evidential reasoning", "belief functions", "Dezert-Smarandache theory",
            "imprecise probability", "credal sets", "subjective logic"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.urls]
Homepage = "https://github.com/mleyvaz/rnel"
Documentation = "https://mleyvaz.github.io/rnel/"
Repository = "https://github.com/mleyvaz/rnel"
Changelog = "https://github.com/mleyvaz/rnel/blob/master/CHANGELOG.md"
DOI = "https://doi.org/10.5281/zenodo.23178344"

[project.optional-dependencies]
nn = ["torch>=2.0"]
credal = ["numpy>=1.23", "scikit-learn>=1.2", "scipy>=1.9"]
dev = ["pytest", "build", "twine"]

[tool.pytest.ini_options]
markers = [
  "theorem(*labels): test checks numbered results from Neutrosophic Evidence",
  "slow: long-running numerical verification",
]

[tool.setuptools.packages.find]
where = ["src"]
