[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnel"
version = "0.3.0"
description = "A toolkit for neutrosophic evidence"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Maikel Yelandi Leyva-Vázquez"}, {name = "Florentin Smarandache"}]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
nn = ["torch>=2.0"]
credal = ["numpy>=1.23", "scikit-learn>=1.2", "scipy>=1.9"]
dev = ["pytest", "build", "twine"]

[tool.pytest.ini_options]
markers = [
  "theorem(*labels): test checks numbered results from Neutrosophic Evidence",
  "slow: long-running numerical verification",
]

[tool.setuptools.packages.find]
where = ["src"]
