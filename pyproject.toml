[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rnel"
version = "0.2.0"
description = "Refined Neutrosophic Evidential Logic: evidence tuples, Subjective Logic operators, priority-product operators, ranking and neural evidential heads"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Maikel Yelandi Leyva-Vázquez"}, {name = "Florentin Smarandache"}]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
nn = ["torch>=2.0"]
credal = ["numpy>=1.23", "scikit-learn>=1.2"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
